name: Build Base Images

on:
    push:
        branches:
            - main
    pull_request_target:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    id-token: write

concurrency:
    group: build-base-images-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build-base-images:
        if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.owner.login == 'getarcaneapp'
        runs-on: depot-ubuntu-24.04-16

        env:
            BASE_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/base

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
                  repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

            - name: Set up Depot CLI
              uses: depot/setup-action@v1

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.repository_owner }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to DHI Container Registry
              uses: docker/login-action@v3
              with:
                  registry: dhi.io
                  username: ${{ secrets.DOCKER_ARCANE_USER }}
                  password: ${{ secrets.DOCKER_ARCANE_PAT }}

            - name: Base image metadata
              id: base-meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.BASE_IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest,enable=${{ github.event_name != 'pull_request_target' }}
                      type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request_target' }}

            - name: Build and push base image
              uses: depot/build-push-action@v1
              with:
                  context: .
                  file: Dockerfile-base
                  platforms: linux/amd64,linux/arm64
                  push: ${{ github.event_name != 'pull_request_target' }}
                  tags: ${{ steps.base-meta.outputs.tags }}
                  sbom: false
                  provenance: true
